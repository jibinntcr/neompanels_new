<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 168" width="580" height="168" role="img" aria-labelledby="npp-horiz-title npp-horiz-desc">
  <title id="npp-horiz-title">NEOM Packing Plywood — Packaging Grade · Moisture Resistant</title>
  <desc id="npp-horiz-desc">A NEOM Panels Brand. Typographic industrial wordmark with layered plywood edge and packing corner bracket.</desc>

  <!-- Industrial Packing Corner Bracket & Layered Plywood Edge Detail -->
  <g transform="translate(12, 20)" aria-hidden="true">
    <path d="M0 0 H40 V10 H10 V40 H0 Z" fill="#073B2A" />
    <path d="M0 128 V88 H10 V118 H40 V128 Z" fill="#073B2A" />
    <rect x="20" y="20" width="8" height="88" fill="#073B2A" />
    <rect x="33" y="20" width="6" height="88" fill="#C7AF89" />
    <rect x="44" y="20" width="8" height="88" fill="#073B2A" />
    <rect x="57" y="20" width="6" height="88" fill="#8C6B3F" />
    <rect x="68" y="20" width="8" height="88" fill="#073B2A" />
    <path d="M62 0 H88 V26 H78 V10 H62 Z" fill="#C7AF89" />
  </g>

  <!-- Vertical Architectural Divider -->
  <line x1="120" y1="20" x2="120" y2="148" stroke="#D7DFD7" stroke-width="2" aria-hidden="true" />

  <!-- Typographic Hierarchy -->
  <g transform="translate(142, 0)">
    <!-- Dominant Element: NEOM -->
    <text
      x="0"
      y="70"
      fill="#073B2A"
      font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif"
      font-size="60"
      font-weight="800"
      letter-spacing="8"
    >NEOM</text>

    <!-- Timber Accent Rule beside NEOM -->
    <rect x="234" y="42" width="188" height="5" fill="#C7AF89" aria-hidden="true" />
    <rect x="234" y="53" width="132" height="3" fill="#073B2A" aria-hidden="true" />

    <!-- Sub-Wordmark: PACKING PLYWOOD -->
    <text
      x="2"
      y="103"
      fill="#073B2A"
      font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif"
      font-size="22"
      font-weight="700"
      letter-spacing="6"
    >PACKING PLYWOOD</text>

    <!-- Supporting Descriptor Pill Bar: PACKAGING GRADE · MOISTURE RESISTANT -->
    <rect x="0" y="116" width="422" height="24" rx="2" fill="#073B2A" aria-hidden="true" />
    <text
      x="211"
      y="132"
      text-anchor="middle"
      fill="#FFFFFF"
      font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif"
      font-size="11.5"
      font-weight="600"
      letter-spacing="2.4"
    >PACKAGING GRADE · MOISTURE RESISTANT</text>

    <!-- Endorsement: A NEOM PANELS BRAND -->
    <text
      x="2"
      y="157"
      fill="#526159"
      font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif"
      font-size="11"
      font-weight="600"
      letter-spacing="3.2"
    >A NEOM PANELS BRAND</text>
  </g>
</svg>
